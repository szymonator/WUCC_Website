version: '3.8'

services:
  climbing-soc:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    ports:
      - "8080:80"
    volumes:
      - .:/usr/share/nginx/html
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    environment:
      - VIRTUAL_HOST=wucc.containers.uwcs.co.uk
    depends_on:
      - analytics-api

  analytics-api:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - ./analytics_data:/app/data
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: always

