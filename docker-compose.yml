version: '3.8'

services:
  climbing-soc:
    build:
      context: .
      dockerfile: Dockerfile
    platform: linux/amd64
    environment:
      - VIRTUAL_HOST=wucc
    depends_on:
      - analytics-api
    restart: always

  analytics-api:
    build:
      context: ./analytics
      dockerfile: Dockerfile
    platform: linux/amd64
    volumes:
      - analytics_data:/app/data
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    restart: always

volumes:
  analytics_data:

