worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # ── Block access to sensitive files and directories ──

        # Hidden files and directories (.git, .gitignore, .env, .DS_Store, etc.)
        location ~ /\. {
            return 404;
        }

        # Docker, infrastructure, and config files
        location ~* ^/(Dockerfile|docker-compose\.yml|nginx\.conf|policy\.yaml|README\.md)$ {
            return 404;
        }

        # ── Standard serving ──

        location / {
            try_files $uri $uri/ =404;
        }

        # Cache static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
