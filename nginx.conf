worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # sendfile uses kernel zero-copy which is unreliable on Docker's overlay2
    # filesystem, causing intermittent empty/corrupt responses for static files.
    sendfile      off;

    keepalive_timeout 65;

    server {
        listen       80;
        server_name  _;
        root         /usr/share/nginx/html;
        index        index.html;

        # Disable absolute redirects to preserve external port mappings in Docker host
        absolute_redirect off;

        # ── Block access to sensitive files and directories ──

        # Hidden files and directories (.git, .gitignore, .env, .DS_Store, etc.)
        location ~ /\. {
            return 404;
        }

        # Docker, infrastructure, and config files
        location ~* ^/(Dockerfile|docker-compose\.yml|nginx\.conf|policy\.yaml|README\.md)$ {
            return 404;
        }

        # ── Standard serving ──

        location /api/ {
            proxy_pass http://analytics-api:3000/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Auth request internal check
        location = /api/auth-check {
            proxy_pass http://analytics-api:3000/auth-check;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Protect stats directory from unauthenticated viewing
        location ^~ /stats/ {
            # Public login page access
            location = /stats/login.html {
                auth_request off;
                try_files $uri =404;
                add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            }

            auth_request /api/auth-check;
            error_page 401 = @error401;

            try_files $uri $uri/ =404;
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        }

        location @error401 {
            return 302 /stats/login.html;
        }

        location / {
            try_files $uri $uri/ =404;
        }

        location ~* \.html$ {
            add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
            expires -1;
        }

        # Cache static assets
        location ~* \.(css|js|jpg|jpeg|png|gif|ico|svg|woff|woff2|ttf|eot|otf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }
}
